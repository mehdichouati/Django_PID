<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des artistes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Liste des artistes</h1>
    <a href="{% url 'artist_create' %}" class="btn btn-success mb-3">+ Nouvel artiste</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for artist in artists %}
            <tr>
                <td>{{ artist.firstname }}</td>
                <td>{{ artist.lastname }}</td>
                <td>
                    <a href="{% url 'artist_show' artist.id %}" class="btn btn-sm btn-info">Voir</a>
                    <a href="{% url 'artist_edit' artist.id %}" class="btn btn-sm btn-warning">Modifier</a>
                    <form method="post" action="{% url 'artist_delete' artist.id %}" style="display:inline;" onsubmit="return confirm('Supprimer cet artiste ?');">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
